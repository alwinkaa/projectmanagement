{% extends 'app/base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete Task?</h1>
    <p>Are you sure you want to delete <strong>{{ task.title }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'project_detail' task.project.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
